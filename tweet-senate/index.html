<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index,follow">
<meta name="description" content="Recent U.S. Senate votes with the bill text annotated in plain words.">
<title>Annotated Senate votes</title>
<style>
:root { --fg: #111; --muted: #595959; --bg: #fff; --link: #1a4fa0; }
@media (prefers-color-scheme: dark) {
  :root { --fg: #ececec; --muted: #a6a6a6; --bg: #111; --link: #8fb4ff; }
}
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  font-size: 1.0625rem; line-height: 1.55;
}
main { max-width: 32.5em; margin: 0 auto; padding: 2.5rem 16px 4rem; }
h1 { font-size: 1.6em; line-height: 1.25; margin: 0 0 1em; font-weight: 700; }
h2 { font-size: 1.25em; line-height: 1.3; margin: 3em 0 .75em; font-weight: 700; }
h3 { font-size: 1.1em; line-height: 1.35; margin: 3em 0 .5em; font-weight: 700; }
h4 { font-size: 1em; line-height: 1.4; margin: 2em 0 .35em; font-weight: 700; }
h3 + .part h4 { margin-top: 1em; }
p { margin: 0 0 1em; }
a { color: var(--link); text-underline-offset: .15em; overflow-wrap: anywhere; }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
blockquote { margin: 0 0 1em 1.25em; }
.controls { margin: 1.5em 0 1.5em; padding-bottom: .5em; border-bottom: 1px solid var(--muted); }
.controls button {
  font: inherit; color: inherit; background: none; border: 0; padding: .25em 0; margin-right: 1.5em;
  text-decoration: underline; text-underline-offset: .15em; cursor: pointer;
}
details { margin: 0 0 1em; }
summary { cursor: pointer; color: var(--muted); font-size: .9em; }
.law { margin: .75em 0 0; }
.line { display: block; margin: 0 0 .35em; }
.d2 { padding-left: 1.25em; } .d3 { padding-left: 2.5em; } .d4 { padding-left: 3.75em; }
.d5 { padding-left: 5em; } .d6 { padding-left: 6.25em; }
ul.sources { padding-left: 1.25em; }
ul.sources li { margin: 0 0 .5em; }
@media print {
  .controls { display: none; }
  details::details-content { content-visibility: visible; display: block; }
  a { color: inherit; }
}
</style>
</head>
<body>
<main>
<h1>Annotated Senate votes</h1>
<p>Recent Senate roll call votes, each with the text that was voted on and a plain note on each main part.</p>
<ul class="sources"><li><a href="119-2-250/">Protect College Sports Act of 2026</a>, S. 4668. Senate roll call 250, September 28, 2026: bill passed 77-22.</li></ul>
</main>
</body>
</html>
