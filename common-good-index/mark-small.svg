<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="">
  <!-- Many into one, small version for 16 to 32 px: six larger dots on the ring and two links. Colours from the Spherical Harmonics sphere: wood dots with wood-brown outlines, a brass ring,
       wood-brown links. The links are deliberately irregular, like a real network, never a star polygon. -->
  <g fill="none" stroke="#c9a234" stroke-width="4" stroke-linecap="round"><path d="M32.00 10.00 A22 22 0 0 1 51.05 21.00"/><path d="M51.05 21.00 A22 22 0 0 1 51.05 43.00"/><path d="M51.05 43.00 A22 22 0 0 1 32.00 54.00"/><path d="M32.00 54.00 A22 22 0 0 1 12.95 43.00"/><path d="M12.95 43.00 A22 22 0 0 1 12.95 21.00"/><path d="M12.95 21.00 A22 22 0 0 1 32.00 10.00"/></g>
  <g fill="none" stroke="#5a3017" stroke-width="3.2" stroke-linecap="round"><path d="M51.05 21.00 Q32.00 32.00 12.95 43.00"/><path d="M51.05 43.00 Q32.00 32.00 12.95 21.00"/></g>
  <g fill="#c98a5c" stroke="#5a3017" stroke-width="2.6"><circle cx="32.00" cy="10.00" r="5.6"/><circle cx="51.05" cy="21.00" r="5.6"/><circle cx="51.05" cy="43.00" r="5.6"/><circle cx="32.00" cy="54.00" r="5.6"/><circle cx="12.95" cy="43.00" r="5.6"/><circle cx="12.95" cy="21.00" r="5.6"/></g>
</svg>
