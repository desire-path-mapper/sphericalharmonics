<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Posterity Index has moved</title>
<link rel="canonical" href="https://sphericalharmonics.org/posterity-index/daily/">
<meta name="robots" content="noindex">
<script>
(function () {  // the same page at the new path, query and fragment kept; a sign-in session moves with it
    var old = '/common-good-index/', now = '/posterity-index/';
    var found = document.cookie.match(/(?:^|; )cgi_session=([A-Za-z0-9_-]+)/);
    if (found) {
        var secure = location.protocol === 'https:' ? '; Secure' : '';
        document.cookie = 'cgi_session=' + found[1] + '; Path=' + now + '; Max-Age=2592000; SameSite=Lax' + secure;
        document.cookie = 'cgi_session=; Path=' + old + '; Max-Age=0; SameSite=Lax' + secure;
    }
    location.replace(location.pathname.replace(old, now) + location.search + location.hash);
})();
</script>
<meta http-equiv="refresh" content="0; url=https://sphericalharmonics.org/posterity-index/daily/">
</head>
<body data-moved-to="/posterity-index/">
<p>Posterity Index has moved to <a href="https://sphericalharmonics.org/posterity-index/daily/">https://sphericalharmonics.org/posterity-index/daily/</a>.</p>
</body>
</html>
